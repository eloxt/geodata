name: Update SRS rules

on:
  schedule:
    # UTC 02:23 / UTC+8 10:23; latest upstream release is resolved at run time.
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: write

concurrency:
  group: publish-srs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Download, convert and validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build.sh
      - name: Publish srs branch
        run: bash scripts/publish.sh
